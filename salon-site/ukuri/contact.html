            <!-- ここからmain -->
            <main>
        <h2>CONTACT</h2>
        <p>ご予約はお電話にてお願いいたします。</p>
       <ul>
           <li>芦屋店<span> TEL：0797-07-9797</span></li>
           <li>岡本店<span>TEL：0797-07-9797</span></li>
           <li>甲子園店<span>TEL：0797-07-9797</span></li>
       </ul>

       <section class="contact">
        <div class="contact-inner">
      
          <form class="contact-form" action="#" method="post">
            
            <!-- Name -->
            <div class="form-row">
              <label class="form-label" for="name">Name</label>
              <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
            </div>
      
            <!-- Address（メール想定） -->
            <div class="form-row">
              <label class="form-label" for="email">Address</label>
              <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
            </div>
      
            <!-- Message -->
            <div class="form-row">
              <label class="form-label" for="message">Message</label>
              <textarea class="form-textarea" id="message" name="message" rows="6" required></textarea>
            </div>
      
            <!-- Send -->
            <div class="form-actions">
              <button class="form-btn" type="submit">SEND</button>
            </div>
      
            <!-- note -->
            <p class="form-note">
              返信にお時間を頂く事がありますので、<br>
              あらかじめご了承願います。
            </p>
      
          </form>
      
        </div>
      </section>

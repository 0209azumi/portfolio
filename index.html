<script>

$(function() {
    var menu = $('.nav'),
    offset = menu.offset();
    $(window).scroll(function () {
      if($(window).scrollTop() > offset.top) {
        menu.addClass('fixed');
      } else {
        menu.removeClass('fixed');
      }
    });
  });

  $(function () {

var $targets = $('main *:not(h1):not(.sub-title)').filter(function() {
  return $(this).children().length === 0 && $(this).text().trim() !== "";
});

$targets.each(function () {
  var text = $(this).text();
  var html = "";

  for (var i = 0; i < text.length; i++) {
    html += '<span class="split-span">' + text[i] + '</span>';
  }
  $(this).html(html);
});

$(window).on('scroll', function () {

  var scroll = $(this).scrollTop();

  var start = $('.top-image').offset().top + $('.top-image').outerHeight() * 0.4;

var end = $('.top-text').offset().top + $('.top-text').outerHeight() * 0.4;

  var $spans = $('.split-span');
  var total = $spans.length;

  if (scroll <= start) {
    $spans.removeClass('active');
    return;
  }

  if (scroll >= end) {
    $spans.addClass('active');
    return;
  }
  var progress = (scroll - start) / (end - start); // 0〜1
  var activeCount = Math.floor(progress * total);

  $spans.removeClass('active');
  $spans.slice(0, activeCount).addClass('active');

});

});


$(function () {

function showFadeins() {
  $('.fadein').each(function (i) {
    var $el = $(this);
    if ($el.hasClass('show')) return; // 1回だけ実行

    var elemTop = $el.offset().top;
    var scroll = $(window).scrollTop();
    var windowHeight = $(window).height();

    // 画面の8割くらい入ったら発火
    if (scroll > elemTop - windowHeight * 0.8) {
      // index によって少しずつディレイ
      var delay = i * 120; // 1枚ごとに120msずつずらす

      setTimeout(function () {
        $el.addClass('show');
      }, delay);
    }
  });
}

showFadeins();                 // 読み込み時
$(window).on('scroll', showFadeins);  // スクロール時
});


</script>
